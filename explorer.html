<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive CRISP-DM MLR explorer: 50 Startups vs Boston Housing, 5 feature selection algorithms.">
<title>MLR Explorer — 50 Startups &amp; Boston Housing</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0b14;--surface:#111220;--card:#181929;--border:#252740;--text:#eceefb;--muted:#8b8fb8;--acc1:#4f46e5;--acc2:#0d9488;--good:#059669;--goodbg:#064e3b;--warn:#d97706;--warnbg:#4a3305;--radius:14px}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:16px;height:60px;position:sticky;top:0;z-index:100}
.logo{font-size:18px;font-weight:700;letter-spacing:-0.5px;white-space:nowrap}
.logo .dot{color:var(--acc1)}
.ds-select{display:flex;align-items:center;gap:10px;margin-left:auto}
.ds-select label{font-size:13px;color:var(--muted);font-weight:500}
select#datasetPicker{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:7px 12px;font:500 13px 'Inter',sans-serif;cursor:pointer;outline:none;transition:border-color .2s}
select#datasetPicker:focus{border-color:var(--acc1)}
.w{max-width:1060px;margin:0 auto;padding:24px 16px 52px}
.hero{border-radius:var(--radius);padding:28px 28px 22px;margin-bottom:20px;position:relative;overflow:hidden}
.hero.startup{background:linear-gradient(135deg,#1e1b6b 0%,#4338ca 55%,#7c3aed 100%)}
.hero.boston{background:linear-gradient(135deg,#0f4c3a 0%,#0d9488 55%,#0891b2 100%)}
.hero h2{font-size:26px;font-weight:700;margin-bottom:8px;color:#fff}
.hero p{color:rgba(255,255,255,.88);font-size:14px;line-height:1.65;max-width:680px;margin-bottom:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:4px 12px;font-size:12px;color:#fff;font-weight:500}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-top:16px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
button.ab{font:500 13px 'Inter',sans-serif;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
button.ab:hover{border-color:var(--muted)}
button.ab.on-s{background:var(--acc1);border-color:var(--acc1);color:#fff}
button.ab.on-b{background:var(--acc2);border-color:var(--acc2);color:#fff}
button.ab.best{border-color:var(--good)}
button.ab.best.on-s,button.ab.best.on-b{background:var(--good)}
button.ab.cliff{border-color:var(--warn)}
button.ab.cliff.on-s,button.ab.cliff.on-b{background:var(--warn);color:#fff}
button.ab small{opacity:.7;margin-left:5px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-top:16px}
.kpi .card{margin:0;transition:.2s}
.kpi .card:hover{border-color:var(--muted)}
.kval{display:block;font-size:22px;font-weight:700;margin:4px 0;letter-spacing:-0.5px}
.ksub{font-size:12px;color:var(--muted)}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px 10px;margin:0 6px 5px 0;font-size:13px}
.note{border-radius:10px;padding:11px 15px;font-size:13px;margin-top:12px}
.note.g{background:var(--goodbg);color:#34d399}.note.w{background:var(--warnbg);color:#fbbf24}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
svg{width:100%;height:auto;display:block}svg text{fill:var(--muted);font-size:11px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
tr.sel td{background:rgba(255,255,255,.04);font-weight:600}
.foot{color:var(--muted);font-size:12px;margin-top:24px;line-height:1.6}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.info-box{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--muted);margin-top:14px;line-height:1.7}
.info-box strong{color:var(--text)}
.sep{height:1px;background:var(--border);margin:18px 0}
</style></head>
<body>
<div class="topbar">
  <div class="logo">&#128202; MLR<span class="dot">.</span>Explorer</div>
  <div class="ds-select">
    <label for="datasetPicker">Dataset:</label>
    <select id="datasetPicker" onchange="switchDS(this.value)">
      <option value="startup">&#128640; 50 Startups</option>
      <option value="boston">&#127968; Boston Housing</option>
    </select>
  </div>
</div>
<div class="w">
  <div class="hero startup" id="heroDiv">
    <h2 id="heroTitle">&#128640; 50 Startups — Feature Selection Explorer</h2>

    <div class="pills" id="pills"></div>
  </div>
  <div class="card">
    <div class="lbl">1. Select feature selection algorithm</div>
    <div class="row" id="mb"></div>
    <div id="kwrap"><div class="sep"></div>
      <div class="lbl">2. Number of features (k)</div>
      <div class="row" id="kb"></div>
    </div>
  </div>
  <div id="single">
    <div class="kpi" id="kpi"></div>
    <div class="card"><div class="lbl" id="plbl"></div><div id="pred"></div><div class="note" id="note"></div></div>
  </div>
  <div class="card"><div class="charts">
    <div><div class="lbl">RMSE by k — lower is better</div><svg id="c1" viewBox="0 0 460 250"></svg></div>
    <div><div class="lbl">R² by k — higher is better</div><svg id="c2" viewBox="0 0 460 250"></svg></div>
  </div><div class="leg" id="leg"></div></div>
  <div class="card"><div class="lbl" id="tl"></div><div class="sc" id="tb"></div></div>
  <div id="infoBox"></div>
  <div class="foot" id="foot"></div>
</div>

function chart(id,series,key,hl){
 const W=460,H=250,L=58,R=14,T=12,B=34;
 const all=series.flatMap(s=>s.v.filter(v=>v!=null));
 let lo=Math.min(...all),hi=Math.max(...all),pad=(hi-lo||1)*.15;lo-=pad;hi+=pad;
 const x=i=>L+(i-1)*(W-L-R)/Math.max(NF-1,1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
 let s='';
 for(let t=0;t<=4;t++){const v=lo+(hi-lo)*t/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".1"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end">${key=='rmse'?v.toFixed(1):v.toFixed(3)}</text>`}
 for(let i=1;i<=NF;i++)s+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${i}</text>`;

 series.forEach(se=>{
  const pts=se.v.map((v,i)=>v!=null?x(i+1)+','+y(v):null).filter(Boolean);

  se.v.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${x(i+1)}" cy="${y(v)}" r="${hl==i+1?6:4}" fill="${se.c}" stroke="var(--bg)" stroke-width="1.5"><title>${se.n} k=${i+1}: ${v}</title></circle>`})});
 $(id).innerHTML=s}
